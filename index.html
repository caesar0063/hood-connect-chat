<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hood Connect</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #001133;
      padding: 15px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #login-screen, #chat-screen {
      flex: 1;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #login-screen.active {
      display: flex;
    }

    #chat-screen.active {
      display: flex;
      flex-direction: row;
    }

    #user-list {
      width: 25%;
      background-color: #0a0a0a;
      border-right: 2px solid #002266;
      overflow-y: auto;
    }

    #user-list h3 {
      text-align: center;
      border-bottom: 1px solid #002266;
      padding: 10px;
    }

    #user-list ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #user-list li {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #001133;
    }

    #user-list li:hover {
      background-color: #001a66;
    }

    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000;
      background-size: cover;
      background-position: center;
      justify-content: space-between;
    }

    #chat-header {
      background-color: #001133;
      padding: 10px;
      font-weight: bold;
      text-align: center;
      border-bottom: 2px solid #0033cc;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      margin: 8px 0;
      line-height: 1.4;
    }

    .system {
      color: #00bfff;
      text-align: center;
    }

    .self {
      text-align: right;
      color: #66ccff;
    }

    .other {
      text-align: left;
      color: #fff;
    }

    #input-area {
      display: flex;
      border-top: 2px solid #0033cc;
    }

    #input-area input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
      font-size: 1em;
      background-color: #111;
      color: #fff;
    }

    #input-area button {
      padding: 10px 15px;
      background-color: #0033cc;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    #input-area button:hover {
      background-color: #0055ff;
    }

    #room-controls {
      text-align: center;
      padding: 8px;
      background-color: #0a0a0a;
      border-top: 2px solid #0033cc;
    }

    #room-controls input {
      width: 70%;
      padding: 6px;
      border: none;
      outline: none;
      background-color: #111;
      color: #fff;
      text-align: center;
    }

    #room-controls button {
      margin-left: 10px;
      background-color: #002299;
      border: none;
      color: #fff;
      padding: 6px 10px;
      cursor: pointer;
    }

    #room-controls button:hover {
      background-color: #0044ff;
    }
  </style>
</head>
<body>
  <header>💬 Hood Connect</header>

  <div id="login-screen" class="active">
    <h2>Welcome to Hood Connect</h2>
    <p>Enter your username to join:</p>
    <input type="text" id="username-input" placeholder="Enter username..." />
    <button id="join-btn">Join Chat</button>
  </div>

  <div id="chat-screen">
    <div id="user-list">
      <h3>Nearby Users</h3>
      <ul id="users"></ul>
    </div>

    <div id="chat-area">
      <div id="chat-header">General Room</div>
      <div id="messages"></div>
      <div id="input-area">
        <input id="message-input" type="text" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
      </div>
      <div id="room-controls">
        <input type="text" id="room-input" placeholder="Enter room name (or leave blank for general)" />
        <button id="join-room-btn">Join Room</button>
      </div>
    </div>
  </div>

  <script>
    // At the top of your JS code
    const WS_URL = "wss://hood-connect-backend.onrender.com";
    
    let socket;
    let username = "";
    let currentRoom = "general";
    let users = new Set();

    const loginScreen = document.getElementById("login-screen");
    const chatScreen = document.getElementById("chat-screen");
    const usernameInput = document.getElementById("username-input");
    const joinBtn = document.getElementById("join-btn");
    const usersList = document.getElementById("users");
    const chatHeader = document.getElementById("chat-header");
    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");
    const joinRoomBtn = document.getElementById("join-room-btn");
    const roomInput = document.getElementById("room-input");

    joinBtn.onclick = () => {
      username = usernameInput.value.trim();
      if (!username) return alert("Please enter a username.");
      startChat();
    };

    function startChat() {
      loginScreen.classList.remove("active");
      chatScreen.classList.add("active");

      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        console.log("Connected to server");
        socket.send(JSON.stringify({ type: "join", username, room: currentRoom }));
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "system") {
          addMessage("system", data.message);
        } else if (data.type === "chat") {
          const sender = data.username === username ? "self" : "other";
          addMessage(sender, `${data.username}: ${data.text}`);
          if (sender === "other") users.add(data.username);
          updateUserList();
        }
      };

      socket.onclose = () => {
        addMessage("system", "Connection closed.");
      };
    }

    function addMessage(type, text) {
      const msg = document.createElement("div");
      msg.className = `message ${type}`;
      msg.textContent = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function updateUserList() {
      usersList.innerHTML = "";
      users.forEach((u) => {
        const li = document.createElement("li");
        li.textContent = u;
        li.onclick = () => startPrivateChat(u);
        usersList.appendChild(li);
      });
    }

    function startPrivateChat(friend) {
      const roomName = [username, friend].sort().join("_");
      currentRoom = roomName;
      chatHeader.textContent = `Private Chat: ${friend}`;
      socket.send(JSON.stringify({ type: "join", username, room: roomName }));
      addMessage("system", `Private chat started with ${friend}`);
    }

    sendBtn.onclick = () => {
      const text = messageInput.value.trim();
      if (!text || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({ type: "chat", text }));
      addMessage("self", `You: ${text}`);
      messageInput.value = "";
    };

    joinRoomBtn.onclick = () => {
      const newRoom = roomInput.value.trim() || "general";
      currentRoom = newRoom;
      chatHeader.textContent = `Room: ${newRoom}`;
      socket.send(JSON.stringify({ type: "join", username, room: newRoom }));
      addMessage("system", `You joined ${newRoom}`);
    };
  </script>
</body>
</html>
