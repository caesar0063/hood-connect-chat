<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hood Connect | Chat</title>
  <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #e5ddd5; margin: 0; }
    #container { max-width: 460px; margin: auto; background: #fff; border: 1px solid #ccc; border-radius: 4px; min-height: 85vh; }
    header { background: #075e54; color: #fff; padding: 16px; text-align: center; }
    .screen { display: none; }
    .active { display: block; }
    .input-block { margin: 16px; }
    input, button, select { padding: 6px; margin: 4px 0; width: 94%; }
    #messages { height: 180px; overflow-y: auto; background: #ece5dd; padding: 8px; border-radius: 5px;}
    .message.me { text-align: right; background: #dcf8c6; border-radius: 5px; padding: 4px; margin: 5px 0;}
    .message.other { text-align: left; background: #fff; border-radius: 5px; padding: 4px; margin: 5px 0;}
    #invite-link { font-size: 0.95em; background: #eef; border: 1px dashed #ccc; margin: 10px; padding: 4px; border-radius:4px;}
    #search-list, #material-list { max-height: 100px; overflow-y: auto; background: #eef; margin: 8px 0; padding: 5px; border-radius: 5px;}
    .item { border-bottom: 1px solid #ccc; padding: 3px; cursor: pointer; }
    .item:hover { background: #ddf; }
    .item:last-child { border-bottom: 0;}
  </style>
</head>
<body>
<div id="container">
  <header>Hood Connect</header>

  <!-- Login -->
  <div id="screen-login" class="screen active">
    <form id="login-form">
      <div class="input-block">
        <input id="login-username" placeholder="Username" required>
        <input id="login-password" type="password" placeholder="Password" required>
      </div>
      <button type="submit">Login</button>
      <button type="button" id="goto-register">Register</button>
    </form>
  </div>

  <!-- Registration -->
  <div id="screen-register" class="screen">
    <form id="register-form">
      <div class="input-block">
        <input id="register-username" placeholder="Username" required>
        <input id="register-password" type="password" placeholder="Password" required>
        <input id="register-bio" placeholder="Bio (optional)">
      </div>
      <button type="submit">Register</button>
      <button type="button" id="goto-login">Back to Login</button>
    </form>
  </div>

  <!-- Room Join/Create -->
  <div id="screen-room" class="screen">
    <form id="room-form">
      <div class="input-block">
        <input id="room-name" placeholder="Room name" required>
      </div>
      <button type="submit">Join or Create Room</button>
    </form>
    <div id="invite-link"></div>
    <button id="goto-materials">Study Materials</button>
    <button id="goto-search">User Search</button>
  </div>

  <!-- Chat UI -->
  <div id="screen-chat" class="screen">
    <div><b>Chat:</b> <span id="room-title"></span></div>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Type message...">
      <button type="submit">Send</button>
    </form>
    <button id="logout-chat">Exit Chat</button>
  </div>

  <!-- User Search -->
  <div id="screen-search" class="screen">
    <form id="search-form">
      <input id="search-query" placeholder="Search user by username">
      <button type="submit">Search</button>
    </form>
    <div id="search-list"></div>
    <button id="search-back">Back</button>
  </div>

  <!-- Study Material Upload/List -->
  <div id="screen-materials" class="screen">
    <form id="material-upload-form">
      <input type="file" id="material-file" required>
      <button type="submit">Upload Material</button>
    </form>
    <div id="material-list"></div>
    <button id="materials-back">Back</button>
  </div>
</div>

<script>
  const API_URL = "https://hood-connect-backend2.onrender.com";
  const SOCKET_URL = "https://hood-connect-backend2.onrender.com";

  // DOM
  const screens = {
    login: document.getElementById('screen-login'),
    register: document.getElementById('screen-register'),
    room: document.getElementById('screen-room'),
    chat: document.getElementById('screen-chat'),
    search: document.getElementById('screen-search'),
    materials: document.getElementById('screen-materials')
  };
  function show(scr) {
    Object.values(screens).forEach(x => x.classList.remove('active'));
    screens[scr].classList.add('active');
  }
  document.getElementById('goto-register').onclick = () => show('register');
  document.getElementById('goto-login').onclick = () => show('login');
  document.getElementById('goto-search').onclick = () => show('search');
  document.getElementById('goto-materials').onclick = () => {show('materials'); fetchMaterials(); };
  document.getElementById('search-back').onclick = () => show('room');
  document.getElementById('materials-back').onclick = () => show('room');

  // Registration & Login
  let currentUser = null, currentRoom = null, socket = null;
  document.getElementById('register-form').onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('register-username').value.trim();
    const password = document.getElementById('register-password').value.trim();
    const bio = document.getElementById('register-bio').value.trim();
    const res = await fetch(API_URL + "/api/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, bio }),
    });
    const data = await res.json();
    if (data.success) {
      alert('Registration successful. Please login.');
      show('login');
    } else { alert(data.error || 'Registration failed.'); }
  };
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const res = await fetch(API_URL + "/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (data.success) {
      currentUser = { userId: data.userId, username: data.username };
      show('room');
    } else { alert(data.error || 'Login failed.'); }
  };

  // Join/Create Room
  document.getElementById('room-form').onsubmit = async (e) => {
    e.preventDefault();
    const roomName = document.getElementById('room-name').value.trim();
    if (!roomName) return;
    await fetch(API_URL + "/api/rooms/create", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({roomName, creatorId: currentUser.userId})
    });
    currentRoom = roomName;
    show('chat');
    document.getElementById('room-title').textContent = currentRoom;
    document.getElementById('invite-link').innerHTML =
      `Room Invite: <input id="room-link" readonly value="${location.origin + location.pathname}?room=${encodeURIComponent(roomName)}" style="width:70%">` +
      `<button onclick="navigator.clipboard.writeText(document.getElementById('room-link').value)">Copy</button>`;
    connectSocket();
  };

  // Chat
  function connectSocket() {
    socket = io(SOCKET_URL);
    socket.emit('join', { room: currentRoom, userId: currentUser.userId });
    socket.on('system', (data) => addMsg(data.message, 'system'));
    socket.on('chat', (msg) => addMsg(`${msg.username}: ${msg.text}`, msg.username === currentUser.username ? 'me' : 'other'));
  }
  document.getElementById('chat-form').onsubmit = (e) => {
    e.preventDefault();
    const txt = document.getElementById('chat-input').value.trim();
    if (!txt) return;
    socket.emit('chat', { text: txt });
    document.getElementById('chat-input').value = '';
  };
  function addMsg(text, cls='other') {
    const div = document.createElement('div');
    div.className = `message ${cls}`;
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  }
  document.getElementById('logout-chat').onclick = () => {
    if (socket) socket.disconnect();
    show('room');
    document.getElementById('messages').innerHTML = '';
    document.getElementById('invite-link').innerHTML = '';
  };

  // User Search (with clickable private chat)
  document.getElementById('search-form').onsubmit = async (e) => {
    e.preventDefault();
    const query = document.getElementById('search-query').value.trim();
    const res = await fetch(API_URL + "/api/users/search?q=" + encodeURIComponent(query));
    const data = await res.json();
    const list = document.getElementById('search-list');
    list.innerHTML = data.results && data.results.length
      ? data.results.map(u => `<div class="item" onclick="startPrivateChat('${u.username}', '${u.userId}')">${u.username} (${u.bio || 'No bio'})</div>`).join('')
      : '<div>No users found</div>';
  };

  // Start Private Chat
  function startPrivateChat(username, userId) {
    // Create unique room ID for private chat (sorted to ensure consistency)
    const roomId = [currentUser.userId, userId].sort().join('-');
    currentRoom = roomId;
    show('chat');
    document.getElementById('room-title').textContent = `Private: ${username}`;
    document.getElementById('invite-link').innerHTML = '';
    connectSocket();
  }

  // Study Material Upload
  document.getElementById('material-upload-form').onsubmit = async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('material-file');
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    const res = await fetch(API_URL + "/api/materials/upload", {
      method: "POST", body: formData
    });
    const data = await res.json();
    if (data.success) {
      fileInput.value = '';
      fetchMaterials();
      alert("File uploaded!");
    } else {
      alert(data.error || "Upload failed.");
    }
  };
  async function fetchMaterials() {
    const res = await fetch(API_URL + "/api/materials/list");
    const mats = await res.json();
    const list = document.getElementById('material-list');
    list.innerHTML = mats.length
      ? mats.map(f => `
        <div class="item">
          <a href="${API_URL}/uploads/${f.file}" target="_blank">${f.originalName}</a>
          <span style="font-size:0.8em;color:#666;"> (${new Date(f.uploadedAt).toLocaleString()})</span>
        </div>
      `).join('')
      : "<div>No files uploaded yet.</div>";
  }

  // Room join by invite (room link in URL)
  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    if (params.has("room")) {
      document.getElementById('room-name').value = decodeURIComponent(params.get("room"));
    }
  };
</script>
</body>
</html>
